<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Legal — MindAware</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Outfit:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #050a0f;
      --surface: #0f1419;
      --border: rgba(255,255,255,0.08);
      --ink: #f5f6fa;
      --muted: #9ea5b5;
      --dim: #4b5563;
      --accent: #FF8A66;
    }
    body { background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; font-size: 1rem; line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .wrap { max-width: 480px; width: 100%; padding: 3rem 1.5rem; }
    .icon { width: 52px; height: 52px; border-radius: 14px; margin-bottom: 1.75rem; display: block; }
    h1 { font-family: 'Outfit', sans-serif; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
    .sub { color: var(--muted); font-size: 0.9375rem; margin-bottom: 2.5rem; }
    .links { display: flex; flex-direction: column; gap: 0.75rem; }
    a.doc {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.125rem 1.25rem;
      text-decoration: none; color: var(--ink);
      transition: border-color .2s, transform .2s;
    }
    a.doc:hover { border-color: rgba(255,138,102,0.35); transform: translateY(-1px); }
    .doc-label { font-size: 0.9375rem; font-weight: 500; }
    .doc-desc { font-size: 0.8125rem; color: var(--muted); margin-top: 2px; }
    .arrow { color: var(--dim); font-size: 1.125rem; flex-shrink: 0; margin-left: 1rem; transition: color .2s; }
    a.doc:hover .arrow { color: var(--accent); }
    footer { margin-top: 3rem; font-size: 0.8125rem; color: var(--dim); text-align: center; }
  </style>
</head>
<body>
<div class="wrap">
  <img class="icon" src="https://chicode-lab.github.io/ChiCodeWebsite/mindaware-icon.png" alt="MindAware" onerror="this.style.display='none'" />
  <h1>MindAware Legal</h1>
  <p class="sub">Legal documents for the MindAware app by ChiCode.</p>

  <div class="links">
    <a class="doc" href="https://chicode-lab.github.io/MindAware-Legal/privacy">
      <div>
        <div class="doc-label">Privacy Policy</div>
        <div class="doc-desc">How we collect, use, and protect your data</div>
      </div>
      <span class="arrow">→</span>
    </a>
    <a class="doc" href="https://chicode-lab.github.io/MindAware-Legal/terms">
      <div>
        <div class="doc-label">Terms of Use</div>
        <div class="doc-desc">Rules, subscriptions, and your rights</div>
      </div>
      <span class="arrow">→</span>
    </a>
  </div>

  <footer>© 2026 ChiCode · <a href="mailto:chicodelabs@gmail.com" style="color:inherit">chicodelabs@gmail.com</a></footer>
</div>
</body>
</html>
